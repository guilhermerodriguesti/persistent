<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Interativo - Informática Forense</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 20px;
      padding-bottom: 40px;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      margin-bottom: 30px;
    }
    .card-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid rgba(0, 0, 0, 0.125);
      padding: 15px 20px;
    }
    .question {
      display: none;
    }
    .question.active {
      display: block;
    }
    .progress {
      height: 8px;
      margin-bottom: 20px;
    }
    .theme-badge {
      font-size: 0.8rem;
      margin-bottom: 15px;
    }
    .option-label {
      display: block;
      padding: 10px 15px;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .option-label:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }
    input[type="radio"]:checked + .option-label {
      background-color: #e9ecef;
      border-color: #ced4da;
    }
    .results-card {
      display: none;
    }
    .timer {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 15px;
    }
    .answer-status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
    }
    .correct {
      background-color: rgba(40, 167, 69, 0.1);
      border-left: 4px solid #28a745;
    }
    .incorrect {
      background-color: rgba(220, 53, 69, 0.1);
      border-left: 4px solid #dc3545;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-header text-center">
            <h1 class="h3 mb-0">🧪 Quiz Interativo - Informática Forense</h1>
          </div>
          <div class="card-body">
            <!-- Barra de progresso -->
            <div class="progress" id="progressBar">
              <div class="progress-bar bg-primary" role="progressbar" style="width: 1.4%" aria-valuenow="1.4" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            
            <!-- Timer -->
            <div class="timer" id="timer">
              <i class="far fa-clock"></i> <span id="timeDisplay">00:00:00</span>
            </div>
            
            <!-- Atalhos de teclado -->
            <div class="text-center mb-3">
              <small class="text-muted">
                <i class="fas fa-keyboard me-1"></i> Atalhos: 
                <span class="badge bg-light text-dark">C</span> para Certo, 
                <span class="badge bg-light text-dark">E</span> para Errado, 
                <span class="badge bg-light text-dark">←</span> <span class="badge bg-light text-dark">→</span> para navegar
              </small>
            </div>
            
            <!-- Formulário de questões -->
            <form id="quizForm"></form>
            
            <!-- Navegação -->
            <div class="d-flex justify-content-between mt-4" id="navigationControls">
              <button type="button" id="prevBtn" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Anterior
              </button>
              <div>
                <span id="questionCounter" class="badge bg-secondary rounded-pill">1/70</span>
              </div>
              <button type="button" id="nextBtn" class="btn btn-outline-primary">
                Próxima <i class="fas fa-arrow-right ms-1"></i>
              </button>
              <button type="button" id="submitBtn" class="btn btn-success" style="display:none">
                <i class="fas fa-check-circle me-1"></i> Finalizar
              </button>
            </div>
          </div>
        </div>
        
        <!-- Card de resultados -->
        <div class="card results-card" id="results">
          <div class="card-header text-center">
            <h2 class="h4 mb-0">Resultado Final</h2>
          </div>
          <div class="card-body" id="resultsContent"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap Bundle com Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Carregar as questões do arquivo externo -->
  <script src="questions_data.js"></script>
  <script>
    let currentQuestion = 0;
    let startTime = new Date();
    let timerInterval;
    let userAnswers = {};

    // Função para inicializar o timer
    function startTimer() {
      timerInterval = setInterval(() => {
        const now = new Date();
        const elapsed = Math.floor((now - startTime) / 1000);
        const hours = Math.floor(elapsed / 3600);
        const minutes = Math.floor((elapsed % 3600) / 60);
        const seconds = elapsed % 60;
        
        document.getElementById('timeDisplay').textContent = 
          `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // Função para carregar as questões
    function loadQuestions() {
      const form = document.getElementById('quizForm');
      
      questions.forEach((q, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = `question ${index === 0 ? 'active' : ''}`;
        questionDiv.innerHTML = `
          <div class="mb-3">
            <span class="badge bg-info theme-badge">${q.theme}</span>
          </div>
          <h5 class="mb-3">Questão ${index + 1}</h5>
          <p class="mb-4">${q.text}</p>
          <div class="mb-3">
            <input type="radio" name="q${index}" value="C" id="q${index}C" style="display: none;">
            <label for="q${index}C" class="option-label">
              <i class="fas fa-check-circle text-success me-2"></i> Certo
            </label>
            
            <input type="radio" name="q${index}" value="E" id="q${index}E" style="display: none;">
            <label for="q${index}E" class="option-label">
              <i class="fas fa-times-circle text-danger me-2"></i> Errado
            </label>
          </div>
        `;
        form.appendChild(questionDiv);
      });
      
      // Atualizar contador total de questões
      document.getElementById('questionCounter').textContent = `1/${questions.length}`;
      
      // Atualizar barra de progresso inicial
      const initialProgress = (1 / questions.length) * 100;
      document.querySelector('.progress-bar').style.width = `${initialProgress}%`;
      document.querySelector('.progress-bar').setAttribute('aria-valuenow', initialProgress);
    }

    // Função para mostrar uma questão específica
    function showQuestion(index) {
      document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
      document.querySelectorAll('.question')[index].classList.add('active');
      
      // Atualizar contador
      document.getElementById('questionCounter').textContent = `${index + 1}/${questions.length}`;
      
      // Atualizar barra de progresso
      const progress = ((index + 1) / questions.length) * 100;
      document.querySelector('.progress-bar').style.width = `${progress}%`;
      document.querySelector('.progress-bar').setAttribute('aria-valuenow', progress);
      
      // Atualizar botões de navegação
      document.getElementById('prevBtn').disabled = index === 0;
      
      if (index === questions.length - 1) {
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'inline-block';
      } else {
        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('submitBtn').style.display = 'none';
      }
    }

    // Event listeners para navegação
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentQuestion > 0) {
        currentQuestion--;
        showQuestion(currentQuestion);
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
      }
    });

    // Event listener para finalizar o quiz
    document.getElementById('submitBtn').addEventListener('click', () => {
      clearInterval(timerInterval);
      showResults();
    });

    // Função para mostrar resultados
    function showResults() {
      const formData = new FormData(document.getElementById('quizForm'));
      const results = [];
      let correctCount = 0;

      // Agrupar resultados por tema
      const themeStats = {};

      questions.forEach((q, index) => {
        const selected = formData.get(`q${index}`);
        const isCorrect = selected === q.answer;
        if (isCorrect) correctCount++;
        
        // Estatísticas por tema
        if (!themeStats[q.theme]) {
          themeStats[q.theme] = { correct: 0, total: 0 };
        }
        themeStats[q.theme].total++;
        if (isCorrect) themeStats[q.theme].correct++;
        
        results.push({
          i: index,
          selected: selected,
          answer: q.answer,
          isCorrect: isCorrect,
          theme: q.theme,
          comment: q.comment
        });
      });

      const percentage = Math.round((correctCount / questions.length) * 100);
      const endTime = new Date();
      const totalTime = Math.floor((endTime - startTime) / 1000);
      const hours = Math.floor(totalTime / 3600);
      const minutes = Math.floor((totalTime % 3600) / 60);
      const seconds = totalTime % 60;

      let html = `
        <div class="text-center mb-4">
          <h3 class="display-4 ${percentage >= 70 ? 'text-success' : percentage >= 50 ? 'text-warning' : 'text-danger'}">
            ${percentage}%
          </h3>
          <p class="lead">Você acertou ${correctCount} de ${questions.length} questões</p>
          <p class="text-muted">Tempo total: ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}</p>
        </div>
      `;

      // Estatísticas por tema
      html += `<h4 class="mt-4 mb-3">Desempenho por Tema</h4>`;
      html += `<div class="row">`;
      
      for (const [theme, data] of Object.entries(themeStats)) {
        const perc = Math.round((data.correct / data.total) * 100);
        html += `
          <div class="col-md-6 mb-3">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">${theme}</h5>
                <div class="progress mb-2">
                  <div class="progress-bar ${perc >= 70 ? 'bg-success' : perc >= 50 ? 'bg-warning' : 'bg-danger'}" 
                       role="progressbar" style="width: ${perc}%" 
                       aria-valuenow="${perc}" aria-valuemin="0" aria-valuemax="100">
                    ${perc}%
                  </div>
                </div>
                <p class="card-text">Acertos: ${data.correct}/${data.total}</p>
              </div>
            </div>
          </div>
        `;
      }
      html += `</div>`;

      html += `<h4 class="mt-4 mb-3">Detalhes por Questão</h4>`;
      
      results.forEach(r => {
        const statusClass = r.isCorrect ? 'correct' : 'incorrect';
        const statusIcon = r.isCorrect ? 'check-circle' : 'times-circle';
        const statusText = r.isCorrect ? 'Correta' : 'Incorreta';
        
        html += `
          <div class="answer-status ${statusClass} mb-3">
            <div class="d-flex justify-content-between">
              <h5>Questão ${r.i + 71}</h5>
              <span class="badge ${r.isCorrect ? 'bg-success' : 'bg-danger'}">
                <i class="fas fa-${statusIcon}"></i> ${statusText}
              </span>
            </div>
            <p><strong>Tema:</strong> ${r.theme}</p>
            <p>${questions[r.i].text}</p>
            <p>
              <strong>Sua resposta:</strong> ${r.selected ? (r.selected === 'C' ? 'Certo' : 'Errado') : 'Não respondida'}<br>
              <strong>Resposta correta:</strong> ${r.answer === 'C' ? 'Certo' : 'Errado'}
            </p>
            <p><strong>Comentário:</strong> ${r.comment}</p>
          </div>
        `;
      });

      html += `
        <div class="text-center mt-4">
          <button type="button" class="btn btn-primary" onclick="location.reload()">
            <i class="fas fa-redo me-2"></i> Reiniciar Quiz
          </button>
        </div>
      `;

      document.getElementById('resultsContent').innerHTML = html;
      document.getElementById('results').style.display = 'block';
      document.querySelector('.card-body').style.display = 'none';
    }

    // Atalhos de teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentQuestion > 0) {
        currentQuestion--;
        showQuestion(currentQuestion);
      } else if (e.key === 'ArrowRight' && currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
      }
      
      if (e.key === 'c' || e.key === 'C') {
        const radio = document.querySelector(`#q${currentQuestion}C`);
        if (radio) radio.checked = true;
      } else if (e.key === 'e' || e.key === 'E') {
        const radio = document.querySelector(`#q${currentQuestion}E`);
        if (radio) radio.checked = true;
      }
    });

    // Inicializar quando as questões estiverem carregadas
    document.addEventListener('DOMContentLoaded', () => {
      // Verificar se as questões foram carregadas
      if (typeof questions !== 'undefined' && questions.length > 0) {
        loadQuestions();
        startTimer();
      } else {
        console.error('Questões não foram carregadas. Verifique se o arquivo questions_data.js está presente.');
        document.getElementById('quizForm').innerHTML = `
          <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Erro!</h4>
            <p>Não foi possível carregar as questões. Verifique se o arquivo <code>questions_data.js</code> está presente no mesmo diretório.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
