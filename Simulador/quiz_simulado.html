<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Interativo - Simulado Geral</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 20px;
      padding-bottom: 40px;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      margin-bottom: 30px;
    }
    .card-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid rgba(0, 0, 0, 0.125);
      padding: 15px 20px;
    }
    .question {
      display: none;
    }
    .question.active {
      display: block;
    }
    .progress {
      height: 8px;
      margin-bottom: 20px;
    }
    .theme-badge {
      font-size: 0.8rem;
      margin-bottom: 15px;
    }
    .option-label {
      display: block;
      padding: 10px 15px;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .option-label:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }
    input[type="radio"]:checked + .option-label {
      background-color: #e9ecef;
      border-color: #ced4da;
    }
    .timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #28a745;
    }
    .btn-group .btn {
      margin: 0 5px;
    }
    .results-section {
      display: none;
    }
    .theme-progress {
      margin-bottom: 15px;
    }
    .theme-progress .progress-bar {
      transition: width 0.3s ease;
    }
    .correct-answer {
      color: #28a745;
      font-weight: bold;
    }
    .incorrect-answer {
      color: #dc3545;
      font-weight: bold;
    }
    .comment-box {
      background-color: #f8f9fa;
      border-left: 4px solid #007bff;
      padding: 15px;
      margin-top: 15px;
      border-radius: 0 5px 5px 0;
    }
    .question-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .keyboard-shortcuts {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 0.9rem;
      z-index: 1000;
    }
    @media (max-width: 768px) {
      .keyboard-shortcuts {
        display: none;
      }
      .btn-group {
        flex-direction: column;
      }
      .btn-group .btn {
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <!-- Cabeçalho -->
        <div class="card">
          <div class="card-header bg-success text-white text-center">
            <h1 class="mb-0">
              <i class="fas fa-graduation-cap"></i>
              Quiz Interativo - Simulado Geral
            </h1>
            <p class="mb-0 mt-2">Teste seus conhecimentos em diversos temas</p>
          </div>
        </div>

        <!-- Painel de Controle -->
        <div class="card">
          <div class="card-body">
            <div class="row align-items-center">
              <div class="col-md-3">
                <div class="timer text-center">
                  <i class="fas fa-clock"></i>
                  <span id="timer">00:00</span>
                </div>
              </div>
              <div class="col-md-6">
                <div class="progress">
                  <div class="progress-bar bg-success" role="progressbar" style="width: 0%" id="progress-bar"></div>
                </div>
                <div class="text-center">
                  <span id="question-counter">Questão 1 de 150</span>
                </div>
              </div>
              <div class="col-md-3 text-center">
                <button class="btn btn-outline-success" onclick="showResults()">
                  <i class="fas fa-chart-bar"></i> Ver Resultados
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Questões -->
        <div id="quiz-container"></div>

        <!-- Navegação -->
        <div class="card">
          <div class="card-body">
            <div class="btn-group d-flex justify-content-center" role="group">
              <button type="button" class="btn btn-outline-secondary" onclick="previousQuestion()">
                <i class="fas fa-arrow-left"></i> Anterior
              </button>
              <button type="button" class="btn btn-outline-primary" onclick="nextQuestion()">
                Próxima <i class="fas fa-arrow-right"></i>
              </button>
              <button type="button" class="btn btn-success" onclick="finishQuiz()">
                <i class="fas fa-check"></i> Finalizar
              </button>
            </div>
          </div>
        </div>

        <!-- Resultados -->
        <div id="results-section" class="results-section">
          <div class="card">
            <div class="card-header bg-success text-white">
              <h3 class="mb-0"><i class="fas fa-trophy"></i> Resultados do Quiz</h3>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <h4>Resultado Geral</h4>
                  <div id="overall-results"></div>
                </div>
                <div class="col-md-6">
                  <h4>Desempenho por Tema</h4>
                  <div id="theme-results"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Atalhos do Teclado -->
  <div class="keyboard-shortcuts">
    <strong>Atalhos:</strong><br>
    C = Certo | E = Errado<br>
    ← → = Navegar | Enter = Próxima
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Arquivo de questões -->
  <script src="quiz_questions_simulado.js"></script>
  
  <script>
    let currentQuestion = 0;
    let userAnswers = [];
    let startTime = new Date();
    let timerInterval;

    // Inicializar quiz
    document.addEventListener('DOMContentLoaded', function() {
      loadQuestions();
      startTimer();
      setupKeyboardShortcuts();
    });

    function loadQuestions() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      questions.forEach((q, index) => {
        // Converter resposta da questão para formato completo para exibição
        const fullAnswer = q.answer === "C" ? "CERTO" : (q.answer === "E" ? "ERRADO" : q.answer);
        
        const questionDiv = document.createElement('div');
        questionDiv.className = `question card ${index === 0 ? 'active' : ''}`;
        questionDiv.innerHTML = `
          <div class="card-body">
            <div class="theme-badge">
              <span class="badge bg-info">${q.theme}</span>
            </div>
            <div class="question-text">${q.text}</div>
            <div class="options">
              <input type="radio" id="q${index}_certo" name="q${index}" value="CERTO">
              <label for="q${index}_certo" class="option-label">
                <i class="fas fa-check-circle text-success"></i> CERTO
              </label>
              <input type="radio" id="q${index}_errado" name="q${index}" value="ERRADO">
              <label for="q${index}_errado" class="option-label">
                <i class="fas fa-times-circle text-danger"></i> ERRADO
              </label>
            </div>
            <div class="comment-box" style="display: none;">
              <strong>Resposta:</strong> <span class="answer-text">${fullAnswer}</span><br>
              <strong>Comentário:</strong> ${q.comment}
            </div>
          </div>
        `;
        container.appendChild(questionDiv);
      });
    }

    function nextQuestion() {
      saveCurrentAnswer();
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
      }
    }

    function previousQuestion() {
      saveCurrentAnswer();
      if (currentQuestion > 0) {
        currentQuestion--;
        showQuestion(currentQuestion);
      }
    }

    function showQuestion(index) {
      document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
      document.querySelectorAll('.question')[index].classList.add('active');
      currentQuestion = index;
      loadSavedAnswer();
      updateProgress();
    }

    function saveCurrentAnswer() {
      const selectedOption = document.querySelector(`input[name="q${currentQuestion}"]:checked`);
      if (selectedOption) {
        userAnswers[currentQuestion] = selectedOption.value;
      }
    }

    function loadSavedAnswer() {
      const answer = userAnswers[currentQuestion];
      if (answer) {
        document.querySelector(`input[name="q${currentQuestion}"][value="${answer}"]`).checked = true;
      }
    }

    function updateProgress() {
      const progress = ((currentQuestion + 1) / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progress}%`;
      document.getElementById('question-counter').textContent = `Questão ${currentQuestion + 1} de ${questions.length}`;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        const now = new Date();
        const diff = now - startTime;
        const minutes = Math.floor(diff / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        document.getElementById('timer').textContent = 
          `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function finishQuiz() {
      saveCurrentAnswer();
      clearInterval(timerInterval);
      showResults();
    }

    function showResults() {
      saveCurrentAnswer();
      
      // Calcular resultados
      let correct = 0;
      const themeStats = {};

      questions.forEach((q, index) => {
        if (!themeStats[q.theme]) {
          themeStats[q.theme] = { correct: 0, total: 0 };
        }
        themeStats[q.theme].total++;

        // Converter resposta da questão para formato completo para comparação
        const fullAnswer = q.answer === "C" ? "CERTO" : (q.answer === "E" ? "ERRADO" : q.answer);
        
        if (userAnswers[index] === fullAnswer) {
          correct++;
          themeStats[q.theme].correct++;
        }

        // Mostrar comentários
        const questionDiv = document.querySelectorAll('.question')[index];
        const commentBox = questionDiv.querySelector('.comment-box');
        const answerText = questionDiv.querySelector('.answer-text');
        
        if (userAnswers[index] === fullAnswer) {
          answerText.className = 'answer-text correct-answer';
        } else {
          answerText.className = 'answer-text incorrect-answer';
        }
        
        commentBox.style.display = 'block';
      });

      // Exibir resultados gerais
      const percentage = Math.round((correct / questions.length) * 100);
      document.getElementById('overall-results').innerHTML = `
        <div class="alert alert-${percentage >= 70 ? 'success' : 'warning'}">
          <h5>Acertos: ${correct}/${questions.length} (${percentage}%)</h5>
          <div class="progress">
            <div class="progress-bar bg-${percentage >= 70 ? 'success' : 'warning'}" 
                 style="width: ${percentage}%"></div>
          </div>
        </div>
      `;

      // Exibir resultados por tema
      let themeHtml = '';
      Object.keys(themeStats).forEach(theme => {
        const stats = themeStats[theme];
        const themePercentage = Math.round((stats.correct / stats.total) * 100);
        themeHtml += `
          <div class="theme-progress">
            <div class="d-flex justify-content-between">
              <span>${theme}</span>
              <span>${stats.correct}/${stats.total} (${themePercentage}%)</span>
            </div>
            <div class="progress">
              <div class="progress-bar bg-${themePercentage >= 70 ? 'success' : 'warning'}" 
                   style="width: ${themePercentage}%"></div>
            </div>
          </div>
        `;
      });
      document.getElementById('theme-results').innerHTML = themeHtml;

      // Mostrar seção de resultados
      document.getElementById('results-section').style.display = 'block';
      document.getElementById('results-section').scrollIntoView({ behavior: 'smooth' });
    }

    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', function(e) {
        switch(e.key.toLowerCase()) {
          case 'c':
            document.querySelector(`input[name="q${currentQuestion}"][value="CERTO"]`).checked = true;
            break;
          case 'e':
            document.querySelector(`input[name="q${currentQuestion}"][value="ERRADO"]`).checked = true;
            break;
          case 'arrowleft':
            previousQuestion();
            break;
          case 'arrowright':
          case 'enter':
            nextQuestion();
            break;
        }
      });
    }
  </script>
</body>
</html>
