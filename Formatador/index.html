<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formatador de Texto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .highlight {
            background-color: yellow;
        }
        
        /* Estilo para melhor legibilidade */
        #resultTable td {
            font-family: 'Segoe UI', 'Roboto', 'Inter', 'Helvetica Neue', Arial, sans-serif;
            white-space: pre;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body class="container py-4">
    <h1 class="mb-3">Formatador de Texto</h1>
    <textarea id="inputText" class="form-control mb-3" rows="10" placeholder="Digite seu texto aqui..."></textarea>
    <button onclick="formatText()" class="btn btn-primary mb-3">Formatar Texto</button>
    <h2 class="mb-3">Texto Verticalizado</h2>
    <table id="resultTable" class="table table-bordered">
        <thead class="table-light">
        </thead>
        <tbody>
        </tbody>
    </table>
    <div class="mt-3">
        <button onclick="copyTable()" class="btn btn-secondary me-2">Copiar Conteúdo da Tabela</button>
        <button onclick="copyFormatted()" class="btn btn-success">Copiar com Formatação e Espaços</button>
    </div>

    <script>
        function formatText() {
            var text = document.getElementById('inputText').value;
            // Normaliza espaços e remove espaços extras
            text = text.replace(/\s+/g, ' ').trim();

            // Define os critérios de divisão para cada linha nova no texto formatado
            var formattedText = text
                .replace(/([.])(\s)/g, "$1\n"); // Insere quebra de linha apenas após ponto seguido de espaço

            var lines = formattedText.split('\n');
            var tbody = document.querySelector('#resultTable tbody');
            tbody.innerHTML = ''; // Limpa o corpo da tabela

            // Encontra o conjunto de palavras que mais se repete
            var wordFrequency = {};
            lines.forEach(line => {
                var words = line.split(/\s+/);
                words.forEach(word => {
                    var normalizedWord = word.toLowerCase();
                    if (normalizedWord in wordFrequency) {
                        wordFrequency[normalizedWord]++;
                    } else {
                        wordFrequency[normalizedWord] = 1;
                    }
                });
            });

            var maxWord = '';
            var maxCount = 0;
            for (var word in wordFrequency) {
                if (wordFrequency[word] > maxCount) {
                    maxWord = word;
                    maxCount = wordFrequency[word];
                }
            }

            // Adiciona cada linha formatada como uma nova linha na tabela
            lines.forEach(function(line) {
                // Preserva todos os caracteres de pontuação
                line = line.trim();

                if (line.length > 0) { // Ignora linhas vazias após a remoção
                    var row = tbody.insertRow();
                    var cell = row.insertCell(0);
                    
                    // Aplica indentação estilo YAML baseada na numeração
                    var indentedLine = applyYamlIndentation(line);
                    
                    // Destaca a palavra mais frequente e as palavras em maiúsculas. 
                    // Em seguida, coloca em negrito a palavra anterior a ':'
                    cell.innerHTML = indentedLine
                        .replace(new RegExp(`\\b${maxWord}\\b`, 'gi'), `<span class="highlight">$&</span>`)
                        .replace(/\b([A-ZÁÉÍÓÚÀÈÌÒÙÂÊÎÔÛÄËÏÖÜÑ]{2,})\b/g, '<strong>$1</strong>')
                        .replace(/\b(\w+):/g, '<strong>$1</strong>:');
                }
            });
        }

        // Função para aplicar indentação estilo YAML
        function applyYamlIndentation(line) {
            // Detecta padrões de numeração: 1, 1.1, 1.1.1, etc.
            var numberPattern = /^(\d+(?:\.\d+)*)\s*(.*)/;
            var match = line.match(numberPattern);
            
            if (match) {
                var number = match[1];
                var content = match[2];
                var dots = (number.match(/\./g) || []).length;
                
                // Calcula a indentação: 4 espaços por nível (estilo YAML)
                var indentSpaces = '&nbsp;'.repeat(dots * 4);
                
                // Retorna com indentação + numeração + conteúdo
                return indentSpaces + number + ' ' + content;
            }
            
            // Se não tem numeração, retorna a linha original
            return line;
        }

        function copyTable() {
            const rows = document.querySelectorAll('#resultTable tr');
            let textToCopy = '';
            rows.forEach(row => {
                textToCopy += row.innerText + '\n';
            });
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Conteúdo da tabela copiado para a área de transferência!');
            }).catch(err => {
                console.error('Erro ao copiar texto: ', err);
            });
        }

        function copyFormatted() {
            const rows = document.querySelectorAll('#resultTable tbody tr');
            let formattedText = '';
            
            rows.forEach(row => {
                const cell = row.querySelector('td');
                if (cell) {
                    // Extrai o texto preservando os espaços HTML (&nbsp;)
                    let lineText = cell.innerHTML;
                    
                    // Converte &nbsp; para espaços normais
                    lineText = lineText.replace(/&nbsp;/g, ' ');
                    
                    // Remove tags HTML mas preserva o conteúdo
                    lineText = lineText.replace(/<[^>]*>/g, '');
                    
                    // Decodifica entidades HTML
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = lineText;
                    lineText = tempDiv.textContent || tempDiv.innerText || '';
                    
                    formattedText += lineText + '\n';
                }
            });
            
            navigator.clipboard.writeText(formattedText).then(() => {
                alert('Texto copiado com formatação e espaços preservados!');
            }).catch(err => {
                console.error('Erro ao copiar texto formatado: ', err);
            });
        }
    </script>
</body>
</html>
