const quizContainer = document.getElementById('quiz-container');

quizData.forEach((q, index) => {
    const questionDiv = document.createElement('div');
    questionDiv.className = 'question-card';

    let optionsHtml = '';
    q.options.forEach((opt, i) => {
        optionsHtml += `<li><label><input type="radio" name="q${index}" value="${i}"> ${opt}</label></li>`;
    });

    questionDiv.innerHTML = `
        <div class="question-text">${q.question}</div>
        <ul class="options">${optionsHtml}</ul>
        <button onclick="checkAnswer(${index}, this)">Responder</button>
        <div class="feedback" id="feedback-${index}"></div>
    `;
    quizContainer.appendChild(questionDiv);
});

function checkAnswer(index, btn) {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    const feedbackDiv = document.getElementById(`feedback-${index}`);

    if (!selected) {
        alert('Por favor, selecione uma opção antes de confirmar sua resposta.');
        return;
    }

    const answerObj = quizData[index];
    const isCorrect = parseInt(selected.value) === answerObj.answer;

    feedbackDiv.style.display = 'block';
    if (isCorrect) {
        feedbackDiv.className = 'feedback correct';
        feedbackDiv.innerHTML = `<strong>✔️ Exato!</strong><div class="explanation"><em>Justificativa:</em> ${answerObj.explanation}</div>`;
    } else {
        feedbackDiv.className = 'feedback incorrect';
        feedbackDiv.innerHTML = `<strong>❌ Errado. A alternativa certa é a ${answerObj.answer + 1}: "${answerObj.options[answerObj.answer]}"</strong><div class="explanation"><em>Justificativa:</em> ${answerObj.explanation}</div>`;
    }
    
    // Desativando os inputs da questão
    const allInputs = document.querySelectorAll(`input[name="q${index}"]`);
    allInputs.forEach(input => input.disabled = true);
    
    // Mudando o botão
    btn.disabled = true;
    btn.textContent = 'Respondido';
}
</script>
