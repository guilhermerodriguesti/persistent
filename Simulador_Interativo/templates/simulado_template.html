<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITULO_SIMULADO}} - Simulador Interativo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --accent: #f59e0b;
            --danger: #ef4444;
            --background: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
        }

        .header-bar {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .header-stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .stat-item i {
            color: var(--primary);
        }

        .timer {
            background: rgba(99, 102, 241, 0.15);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            color: var(--primary);
        }

        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .question-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .question-number {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .question-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .meta-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .alternatives {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .alternative {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .alternative:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            transform: translateX(8px);
        }

        .alternative.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
        }

        .alternative.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--secondary);
        }

        .alternative.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
        }

        .alternative-letter {
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .alternative.correct .alternative-letter {
            background: var(--secondary);
        }

        .alternative.wrong .alternative-letter {
            background: var(--danger);
        }

        .alternative-text {
            flex: 1;
            font-size: 1rem;
            line-height: 1.6;
        }

        .navigation-bar {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-nav {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-finish {
            background: var(--secondary);
        }

        .btn-finish:hover {
            background: #059669;
        }

        .progress-bar-custom {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
            border-radius: 10px;
        }

        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .results-modal.show {
            display: flex;
        }

        .results-content {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .results-icon {
            font-size: 5rem;
            margin-bottom: 24px;
        }

        .results-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .results-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-stat {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
        }

        .result-stat-value {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
        }

        .result-stat-label {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .results-stats {
                grid-template-columns: 1fr;
            }

            .navigation-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="header-bar">
        <div class="header-content">
            <h1 class="header-title">
                <i class="fas fa-graduation-cap me-2"></i>
                {{TITULO_SIMULADO}}
            </h1>
            <div class="header-stats">
                <div class="stat-item">
                    <i class="fas fa-question-circle"></i>
                    <span id="currentQuestion">1</span> / <span id="totalQuestions">0</span>
                </div>
                <div class="timer" id="timer">00:00:00</div>
            </div>
        </div>
    </header>

    <div class="container-main">
        <div id="questionContainer"></div>

        <div class="navigation-bar">
            <button class="btn-nav" id="btnPrevious" onclick="previousQuestion()">
                <i class="fas fa-arrow-left"></i>
                Anterior
            </button>

            <div class="progress-bar-custom">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <button class="btn-nav" id="btnNext" onclick="nextQuestion()">
                Próxima
                <i class="fas fa-arrow-right"></i>
            </button>

            <button class="btn-nav btn-finish" id="btnFinish" onclick="finishSimulado()">
                <i class="fas fa-flag-checkered"></i>
                Finalizar
            </button>
        </div>
    </div>

    <div class="results-modal" id="resultsModal">
        <div class="results-content">
            <div class="results-icon">🎉</div>
            <h2 class="results-title">Simulado Concluído!</h2>
            <div class="results-score" id="finalScore">0%</div>
            
            <div class="results-stats">
                <div class="result-stat">
                    <span class="result-stat-value" style="color: var(--secondary);" id="correctCount">0</span>
                    <span class="result-stat-label">Acertos</span>
                </div>
                <div class="result-stat">
                    <span class="result-stat-value" style="color: var(--danger);" id="wrongCount">0</span>
                    <span class="result-stat-label">Erros</span>
                </div>
                <div class="result-stat">
                    <span class="result-stat-value" style="color: var(--accent);" id="totalTime">00:00</span>
                    <span class="result-stat-label">Tempo</span>
                </div>
            </div>

            <button class="btn-nav" onclick="location.href='index.html'">
                <i class="fas fa-home"></i>
                Voltar ao Início
            </button>
        </div>
    </div>

    <script src="{{DATA_FILE}}"></script>
    <script>
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let startTime = Date.now();
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const hours = Math.floor(elapsed / 3600000);
                const minutes = Math.floor((elapsed % 3600000) / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                document.getElementById('timer').textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function loadQuestion(index) {
            const question = questions[index];
            const container = document.getElementById('questionContainer');
            
            const alternativesHTML = question.alternatives.map((alt, i) => {
                const letter = String.fromCharCode(65 + i);
                const selected = userAnswers[index] === i ? 'selected' : '';
                return `
                    <div class="alternative ${selected}" onclick="selectAlternative(${index}, ${i})">
                        <div class="alternative-letter">${letter}</div>
                        <div class="alternative-text">${alt}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="question-card">
                    <div class="question-header">
                        <div class="question-number">Questão ${index + 1}</div>
                        <div class="question-meta">
                            ${question.subject ? `<span class="meta-badge"><i class="fas fa-book"></i> ${question.subject}</span>` : ''}
                            ${question.year ? `<span class="meta-badge"><i class="fas fa-calendar"></i> ${question.year}</span>` : ''}
                            ${question.institution ? `<span class="meta-badge"><i class="fas fa-building"></i> ${question.institution}</span>` : ''}
                        </div>
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div class="alternatives">${alternativesHTML}</div>
                </div>
            `;

            document.getElementById('currentQuestion').textContent = index + 1;
            document.getElementById('btnPrevious').disabled = index === 0;
            document.getElementById('btnNext').disabled = index === questions.length - 1;
            
            updateProgress();
        }

        function selectAlternative(questionIndex, alternativeIndex) {
            userAnswers[questionIndex] = alternativeIndex;
            loadQuestion(questionIndex);
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        }

        function updateProgress() {
            const answered = Object.keys(userAnswers).length;
            const total = questions.length;
            const percentage = (answered / total) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        function finishSimulado() {
            if (Object.keys(userAnswers).length < questions.length) {
                if (!confirm('Você ainda não respondeu todas as questões. Deseja finalizar mesmo assim?')) {
                    return;
                }
            }

            clearInterval(timerInterval);
            
            let correct = 0;
            let wrong = 0;

            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) {
                    correct++;
                } else if (userAnswers[i] !== undefined) {
                    wrong++;
                }
            });

            const score = ((correct / questions.length) * 100).toFixed(1);
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);

            document.getElementById('finalScore').textContent = score + '%';
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('totalTime').textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            document.getElementById('resultsModal').classList.add('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('totalQuestions').textContent = questions.length;
            loadQuestion(0);
            startTimer();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
