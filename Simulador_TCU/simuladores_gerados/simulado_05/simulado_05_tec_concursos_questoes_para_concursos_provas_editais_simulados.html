<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Simulados TCU 2025 - Preparação de Alta Performance">
    <meta name="theme-color" content="#6366f1">
    <title>Simulado TCU 2025/2026 - Simulado 05 Tec Concursos Questoes Para Concursos Provas Editais Simulados</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons & Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Glassmorphism Header */
        .glass-header {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin: 4px 0 0 0;
        }

        .btn-dash {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-dash:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Stats Grid */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-val {
            display: block;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-container {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Question Interface */
        .question-box {
            background: white;
            color: #1e293b;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f1f5f9;
        }

        .q-num {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .q-cat {
            background: #f1f5f9;
            color: #64748b;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .q-text {
            font-size: 1.15rem;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 32px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .opt-btn {
            border: 2px solid #e2e8f0;
            background: white;
            padding: 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            touch-action: manipulation;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f8fafc;
            transform: translateY(-2px);
        }

        .opt-btn.correct {
            background: var(--secondary) !important;
            color: white !important;
            border-color: var(--secondary) !important;
        }

        .opt-btn.incorrect {
            background: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }

        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Feedback Area */
        .feedback-area {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 24px;
            display: none;
            border: 1px solid #e2e8f0;
        }

        .feedback-area.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-text {
            font-size: 0.95rem;
            color: #475569;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 12px;
        }

        /* Nav Buttons */
        .nav-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-prev {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-prev:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Results Screen */
        .results-box {
            display: none;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .res-score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--secondary);
            margin: 20px 0;
            font-family: 'Outfit';
        }

        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 32px 0;
        }

        .res-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .btn-restart {
            background: white;
            color: var(--background);
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-restart:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .question-box {
                padding: 20px;
            }

            .hero-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-top">
                <div class="header-title">
                    <h1 id="mainTitle"><i class="fas fa-graduation-cap me-2"></i> Simulado 05 Tec Concursos Questoes Para Concursos Provas Editais Simulados</h1>
                    <p id="subTitle">Simulado TCU 2025/2026 | Simulado 05</p>
                </div>
                <a href="../../index.html" class="btn-dash"><i class="fas fa-home me-1"></i> Dashboard</a>
            </div>

            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-val" id="currentQ">1</span>
                    <span class="stat-lbl">Questão</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="totalQ">50</span>
                    <span class="stat-lbl">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" style="color: var(--secondary);" id="correctCount">0</span>
                    <span class="stat-lbl">Acertos</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="timer">00:00</span>
                    <span class="stat-lbl">Tempo</span>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </header>

        <!-- Question Section -->
        <div id="quizSection">
            <div class="question-box">
                <div class="q-meta">
                    <span class="q-num">Item <span id="qNumDisplay">1</span></span>
                    <span class="q-cat" id="qCategory">Categoria</span>
                </div>
                <div class="q-text" id="qText">Carregando questão...</div>

                <div class="options-grid">
                    <button class="opt-btn" id="btnCerto" onclick="handleChoice('CERTO')">
                        <i class="fas fa-check-circle me-2"></i> CERTO
                    </button>
                    <button class="opt-btn" id="btnErrado" onclick="handleChoice('ERRADO')">
                        <i class="fas fa-times-circle me-2"></i> ERRADO
                    </button>
                </div>

                <div class="feedback-area" id="feedbackBox">
                    <div class="feedback-title" id="fbTitle"></div>
                    <div class="feedback-text" id="fbText"></div>
                </div>
            </div>

            <div class="nav-row">
                <button class="nav-btn btn-prev" id="btnPrev" onclick="changeQuestion(-1)">
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
                <button class="nav-btn btn-next" id="btnNext" onclick="changeQuestion(1)" disabled>
                    Próxima <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-box">
            <div class="card-icon mb-4" style="font-size: 3rem; color: var(--accent);"><i class="fas fa-trophy"></i>
            </div>
            <h2 class="fw-bold">Simulado Concluído!</h2>
            <div class="res-score" id="finalScore">0%</div>

            <div class="res-grid">
                <div class="res-item">
                    <span class="stat-val" id="finalCorrect">0</span>
                    <span class="stat-lbl">Acertos</span>
                </div>
                <div class="res-item">
                    <span class="stat-val" id="finalTime">00:00</span>
                    <span class="stat-lbl">Tempo</span>
                </div>
            </div>

            <button class="btn-restart" onclick="location.reload()">
                <i class="fas fa-redo me-2"></i> Reiniciar Simulado
            </button>
        </div>
    </div>

    <script src="simulado_05_tec_concursos_questoes_para_concursos_provas_editais_simulados_data.js"></script>
    <script>
        let curIdx = 0;
        let score = 0;
        let answered = false;
        let start = Date.now();
        let timerInt;

        function updateTimer() {
            const sec = Math.floor((Date.now() - start) / 1000);
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            document.getElementById('timer').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function loadQ() {
            const q = questions[curIdx];
            document.getElementById('currentQ').textContent = curIdx + 1;
            document.getElementById('qNumDisplay').textContent = curIdx + 1;
            document.getElementById('totalQ').textContent = questions.length;
            document.getElementById('qCategory').textContent = q.category;
            document.getElementById('qText').textContent = q.text;

            const p = ((curIdx + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = p + '%';

            // Reset UI
            document.getElementById('btnCerto').className = 'opt-btn';
            document.getElementById('btnErrado').className = 'opt-btn';
            document.getElementById('btnCerto').disabled = false;
            document.getElementById('btnErrado').disabled = false;
            document.getElementById('feedbackBox').classList.remove('show');
            document.getElementById('btnNext').disabled = true;
            document.getElementById('btnPrev').disabled = curIdx === 0;

            answered = false;
        }

        function handleChoice(choice) {
            if (answered) return;
            answered = true;

            const q = questions[curIdx];
            const isCorrect = choice === q.answer;
            if (isCorrect) score++;

            const btnC = document.getElementById('btnCerto');
            const btnE = document.getElementById('btnErrado');
            btnC.disabled = true;
            btnE.disabled = true;

            const selectedBtn = choice === 'CERTO' ? btnC : btnE;
            selectedBtn.classList.add(isCorrect ? 'correct' : 'incorrect');

            if (!isCorrect) {
                const correctBtn = q.answer === 'CERTO' ? btnC : btnE;
                correctBtn.classList.add('correct');
            }

            // Feedback
            const fbBox = document.getElementById('feedbackBox');
            const fbTitle = document.getElementById('fbTitle');
            const fbText = document.getElementById('fbText');

            fbBox.classList.add('show');
            fbTitle.innerHTML = isCorrect ?
                `<i class="fas fa-check-circle text-success"></i> Correto!` :
                `<i class="fas fa-times-circle text-danger"></i> Incorreto!`;
            fbTitle.style.color = isCorrect ? 'var(--secondary)' : 'var(--danger)';
            fbText.innerHTML = `<strong>Gabarito: ${q.answer}</strong><br>${q.explanation}`;

            document.getElementById('correctCount').textContent = score;
            document.getElementById('btnNext').disabled = false;

            if (curIdx === questions.length - 1) {
                document.getElementById('btnNext').innerHTML = 'Ver Resultado <i class="fas fa-flag-checkered ms-1"></i>';
            }
        }

        function changeQuestion(dir) {
            if (dir === 1 && curIdx === questions.length - 1) {
                showResults();
                return;
            }
            curIdx += dir;
            loadQ();
        }

        function showResults() {
            clearInterval(timerInt);
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';

            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('finalScore').textContent = pct + '%';
            document.getElementById('finalCorrect').textContent = score;
            document.getElementById('finalTime').textContent = document.getElementById('timer').textContent;
        }

        document.addEventListener('keydown', e => {
            if (answered) {
                if (e.key === 'ArrowRight') changeQuestion(1);
            } else {
                if (e.key.toLowerCase() === 'c') handleChoice('CERTO');
                if (e.key.toLowerCase() === 'e') handleChoice('ERRADO');
            }
        });

        timerInt = setInterval(updateTimer, 1000);
        loadQ();
    </script>
</body>

</html>
