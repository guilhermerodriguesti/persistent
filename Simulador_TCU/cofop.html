<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Flashcards para revisão sistematizada de Fiscalização Contábil, Financeira e Orçamentária da Constituição Federal de 1988">
  <title>Flashcards - Fiscalização Orçamentária (CF/88)</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --secondary-color: #10b981;
      --accent-color: #f59e0b;
      --background-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--background-color);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
    }

    .app-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header fixo estilo Instagram */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      padding: env(safe-area-inset-top, 0) 1rem 0.75rem 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 100%;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .progress-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      transition: var(--transition);
    }

    .menu-btn:active {
      background: rgba(148, 163, 184, 0.1);
    }

    /* Container principal dos cards */
    .cards-container {
      flex: 1;
      position: relative;
      margin-top: calc(env(safe-area-inset-top, 0) + 4rem);
      margin-bottom: 5rem;
      overflow: hidden;
    }

    .card-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      transform: translateX(100%);
      transition: var(--transition);
    }

    .card-wrapper.active {
      opacity: 1;
      transform: translateX(0);
    }

    .card-wrapper.prev {
      opacity: 0;
      transform: translateX(-100%);
    }

    .card {
      width: 100%;
      max-width: 400px;
      height: 70vh;
      max-height: 600px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: var(--border-radius);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .card-front {
      background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
      color: white;
    }

    .card-back {
      background: linear-gradient(135deg, var(--secondary-color) 0%, #059669 100%);
      color: white;
      transform: rotateY(180deg);
    }

    .card-number {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .card-label {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    .card-content {
      font-size: 1.1rem;
      line-height: 1.6;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .flip-hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Controles de navegação */
    .navigation {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem 1rem calc(env(safe-area-inset-bottom, 0) + 1rem) 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      z-index: 100;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 400px;
      margin: 0 auto;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text-primary);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition);
      touch-action: manipulation;
    }

    .nav-btn:active {
      transform: scale(0.95);
      background: var(--primary-color);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .flip-btn {
      background: var(--accent-color);
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
    }

    .flip-btn:active {
      background: #d97706;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    /* Menu lateral */
    .side-menu {
      position: fixed;
      top: 0;
      right: -300px;
      width: 300px;
      height: 100vh;
      background: var(--card-bg);
      z-index: 200;
      transition: var(--transition);
      padding: 2rem 1rem;
      border-left: 1px solid rgba(148, 163, 184, 0.1);
    }

    .side-menu.open {
      right: 0;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-item {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      cursor: pointer;
      transition: var(--transition);
    }

    .menu-item:hover {
      background: rgba(148, 163, 184, 0.1);
    }

    /* Responsividade */
    @media (max-width: 480px) {
      .card {
        height: 65vh;
      }

      .card-face {
        padding: 1.5rem;
      }

      .card-content {
        font-size: 1rem;
      }
    }

    /* Acessibilidade */
    @media (prefers-reduced-motion: reduce) {
      .card-inner,
      .card-wrapper,
      .nav-btn {
        transition: none;
      }

      .flip-hint {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header fixo estilo Instagram -->
    <header class="header">
      <div class="header-content">
        <div class="logo">Flashcards CF/88</div>
        <div class="progress-indicator">
          <span id="currentCard">1</span>/<span id="totalCards">21</span>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
      </div>
    </header>

    <!-- Container principal dos cards -->
    <main class="cards-container" id="cardsContainer">
      <!-- Cards serão gerados aqui -->
    </main>

    <!-- Navegação inferior -->
    <nav class="navigation">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="previousCard()">←</button>
        <button class="flip-btn" onclick="flipCurrentCard()">🔄</button>
        <button class="nav-btn" id="nextBtn" onclick="nextCard()">→</button>
      </div>
    </nav>

    <!-- Menu lateral -->
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <aside class="side-menu" id="sideMenu">
      <h3 style="margin-bottom: 2rem; color: var(--text-primary);">Opções</h3>
      <div class="menu-item" onclick="shuffleCards()">
        🔀 Embaralhar Cards
      </div>
      <div class="menu-item" onclick="resetProgress()">
        🔄 Reiniciar Progresso
      </div>
      <div class="menu-item" onclick="showAllAnswers()">
        👁️ Ver Todas Respostas
      </div>
      <div class="menu-item" onclick="goToCard(0)">
        ⏮️ Voltar ao Início
      </div>
      <div class="menu-item" onclick="toggleAutoPlay()">
        ⏯️ Auto-Play
      </div>
    </aside>
  </div>

  <script>
    const flashcards = [
      ["Quem exerce a fiscalização contábil, financeira, orçamentária, operacional e patrimonial da União?",
       "Congresso Nacional (controle externo) e sistemas de controle interno de cada Poder."],
      ["O que deve ser observado na fiscalização contábil e financeira da União?",
       "Legalidade, legitimidade, economicidade, aplicação das subvenções e renúncia de receitas."],
      ["Quem é obrigado a prestar contas ao poder público segundo o art. 70, parágrafo único?",
       "Qualquer pessoa física ou jurídica que administre recursos públicos ou assuma obrigações em nome da União."],
      ["Qual órgão auxilia o Congresso Nacional no exercício do controle externo?",
       "O Tribunal de Contas da União (TCU)."],
      ["Qual é o prazo para o TCU emitir parecer prévio sobre as contas do Presidente da República?",
       "60 dias a partir do recebimento das contas."],
      ["O TCU pode julgar as contas de quais tipos de agentes públicos?",
       "Administradores e responsáveis por bens públicos da administração direta e indireta."],
      ["Em quais atos o TCU deve apreciar a legalidade para fins de registro?",
       "Admissões de pessoal (exceto cargos comissionados) e concessões de aposentadorias, reformas e pensões."],
      ["O TCU pode realizar auditorias por iniciativa própria?",
       "Sim, ou por solicitação da Câmara, Senado, ou comissões técnicas/inquérito."],
      ["O que acontece se o órgão não cumpre determinação do TCU?",
       "O TCU pode sustar o ato e comunicar ao Congresso Nacional."],
      ["As decisões do TCU que impõem débito ou multa têm qual natureza jurídica?",
       "Têm eficácia de título executivo."],
      ["O que a Comissão Mista pode fazer diante de despesa não autorizada?",
       "Solicitar esclarecimentos à autoridade (5 dias) e, se insuficientes, pedir pronunciamento ao TCU (30 dias)."],
      ["O que pode ocorrer se o TCU considerar a despesa irregular e ela causar grave dano?",
       "A Comissão Mista pode propor ao Congresso a sustação da despesa."],
      ["Quantos Ministros compõem o TCU e onde ele está sediado?",
       "9 Ministros; sede no Distrito Federal."],
      ["Quais os requisitos para ser Ministro do TCU?",
       "Mais de 35 e menos de 70 anos, idoneidade moral, notório saber, 10 anos de experiência compatível."],
      ["Como se dá a escolha dos Ministros do TCU?",
       "1/3 pelo Presidente (com aprovação do Senado) e 2/3 pelo Congresso Nacional."],
      ["Quais são as garantias dos Ministros do TCU?",
       "As mesmas dos Ministros do STJ: garantias, impedimentos, vencimentos e aposentadoria conforme o art. 40."],
      ["Qual a finalidade do sistema de controle interno dos Poderes?",
       "Avaliar metas, legalidade, eficiência e apoiar o controle externo."],
      ["O que o controle interno deve fazer se encontrar irregularidade?",
       "Comunicar imediatamente ao TCU, sob pena de responsabilidade solidária."],
      ["Quem pode denunciar irregularidades ao TCU?",
       "Qualquer cidadão, partido político, associação ou sindicato, conforme a lei."],
      ["As normas sobre fiscalização da União aplicam-se a quais outros órgãos?",
       "TCs dos Estados, do DF e Tribunais/Conselhos de Contas dos Municípios."],
      ["Como deve ser a composição dos Tribunais de Contas Estaduais, segundo a CF?",
       "Compostos por 7 Conselheiros, conforme definido nas Constituições Estaduais."]
    ];

    let currentIndex = 0;
    let studiedCards = new Set();
    let currentCards = [...flashcards];
    let autoPlayInterval = null;
    let touchStartX = 0;
    let touchEndX = 0;

    function createCard(cardData, index) {
      const [question, answer] = cardData;
      const wrapper = document.createElement('div');
      wrapper.className = 'card-wrapper';
      wrapper.setAttribute('data-index', index);
      
      wrapper.innerHTML = `
        <div class="card" onclick="flipCurrentCard()">
          <div class="card-inner">
            <div class="card-face card-front">
              <div class="card-number">${index + 1}/21</div>
              <div class="card-label">Pergunta</div>
              <div class="card-content">${question}</div>
              <div class="flip-hint">Toque para ver a resposta</div>
            </div>
            <div class="card-face card-back">
              <div class="card-number">${index + 1}/21</div>
              <div class="card-label">Resposta</div>
              <div class="card-content">${answer}</div>
              <div class="flip-hint">Toque para voltar</div>
            </div>
          </div>
        </div>
      `;
      
      return wrapper;
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';
      
      currentCards.forEach((cardData, index) => {
        const cardWrapper = createCard(cardData, index);
        container.appendChild(cardWrapper);
      });
      
      showCard(currentIndex);
    }

    function showCard(index) {
      const wrappers = document.querySelectorAll('.card-wrapper');
      wrappers.forEach((wrapper, i) => {
        wrapper.classList.remove('active', 'prev');
        if (i === index) {
          wrapper.classList.add('active');
        } else if (i < index) {
          wrapper.classList.add('prev');
        }
      });
      
      updateUI();
    }

    function updateUI() {
      document.getElementById('currentCard').textContent = currentIndex + 1;
      document.getElementById('totalCards').textContent = currentCards.length;
      
      const progress = ((currentIndex + 1) / currentCards.length) * 100;
      document.getElementById('progressFill').style.width = `${progress}%`;
      
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === currentCards.length - 1;
    }

    function nextCard() {
      if (currentIndex < currentCards.length - 1) {
        currentIndex++;
        showCard(currentIndex);
        
        // Reset flip state
        const currentCard = document.querySelector('.card-wrapper.active .card');
        if (currentCard) {
          currentCard.classList.remove('flipped');
        }
      }
    }

    function previousCard() {
      if (currentIndex > 0) {
        currentIndex--;
        showCard(currentIndex);
        
        // Reset flip state
        const currentCard = document.querySelector('.card-wrapper.active .card');
        if (currentCard) {
          currentCard.classList.remove('flipped');
        }
      }
    }

    function flipCurrentCard() {
      const currentCard = document.querySelector('.card-wrapper.active .card');
      if (currentCard) {
        currentCard.classList.toggle('flipped');
        
        if (currentCard.classList.contains('flipped')) {
          studiedCards.add(currentIndex);
        }
      }
    }

    function goToCard(index) {
      if (index >= 0 && index < currentCards.length) {
        currentIndex = index;
        showCard(currentIndex);
        closeMenu();
      }
    }

    function shuffleCards() {
      currentCards = [...flashcards].sort(() => Math.random() - 0.5);
      currentIndex = 0;
      studiedCards.clear();
      renderCards();
      closeMenu();
    }

    function resetProgress() {
      currentIndex = 0;
      studiedCards.clear();
      currentCards = [...flashcards];
      renderCards();
      closeMenu();
    }

    function showAllAnswers() {
      const cards = document.querySelectorAll('.card');
      cards.forEach((card, index) => {
        card.classList.add('flipped');
        studiedCards.add(index);
      });
      closeMenu();
    }

    function toggleAutoPlay() {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
      } else {
        autoPlayInterval = setInterval(() => {
          if (currentIndex < currentCards.length - 1) {
            nextCard();
          } else {
            clearInterval(autoPlayInterval);
            autoPlayInterval = null;
          }
        }, 4000);
      }
      closeMenu();
    }

    function toggleMenu() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      
      menu.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function closeMenu() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      
      menu.classList.remove('open');
      overlay.classList.remove('open');
    }

    // Suporte a gestos de swipe
    function handleTouchStart(e) {
      touchStartX = e.changedTouches[0].screenX;
    }

    function handleTouchEnd(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartX - touchEndX;
      
      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          // Swipe left - next card
          nextCard();
        } else {
          // Swipe right - previous card
          previousCard();
        }
      }
    }

    // Atalhos de teclado
    document.addEventListener('keydown', (e) => {
      switch(e.key) {
        case 'ArrowLeft':
          e.preventDefault();
          previousCard();
          break;
        case 'ArrowRight':
          e.preventDefault();
          nextCard();
          break;
        case ' ':
        case 'Enter':
          e.preventDefault();
          flipCurrentCard();
          break;
        case 'Escape':
          closeMenu();
          break;
      }
    });

    // Event listeners para touch
    document.addEventListener('touchstart', handleTouchStart, { passive: true });
    document.addEventListener('touchend', handleTouchEnd, { passive: true });

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      renderCards();
      
      // Prevenir zoom no double tap
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    });
  </script>
</body>
</html>
